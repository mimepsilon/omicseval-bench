name: OmicsEval-Bench CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install core system dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch pandas scikit-learn pytest

    - name: Execute Framework Test Suite
      run: |
        pytest tests/

